[npc]
dir = "npc/kevin.npc"

[engine]
backend = "llamacpp"          # "mock" or "llamacpp"
model_path = "npcframework/inference/models/gemma-3-4b-it-q4_0.gguf"
n_ctx = 8192
n_threads = 8
n_gpu_layers = 0
temperature = 0.7
top_p = 0.9
max_tokens = 256

[session]
channel = "cli"
environment_id = "local"
environment_name = "local"
history_limit = 20

# Prompt compilation toggles
include_state_in_prompt = true
include_tools_in_prompt = true
include_perception_in_prompt = true
include_memory_in_prompt = true

# Optional runtime defaults (safe to leave empty)
runtime_env_facts = []
runtime_env_rules = []
runtime_perception_facts = []

# Optional identity tweaks
identity_role_append = ""

[debug]
dump_dir = ".npc/debug"
dump_messages_json = true
dump_messages_txt = true

[tools]
# Enable builtin tool-calling (safe demo tools)
enabled = true
allowlist = ["time_now", "add"]
