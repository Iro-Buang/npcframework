strategy: simple_router_v0

priorities:
  - Correctness > confidence
  - User intent > verbosity
  - Cheap logic before expensive inference

routing:
  system1:
    description: Rules/heuristics. No LLM needed.
    examples: ["format validation", "simple calculations", "state transitions"]
  system2:
    description: LLM for dialogue + light reasoning.
  system3:
    description: Deep reasoning + memory retrieval + heavy context (optional).
