[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npcframework"
version = "0.1.0"
description = "Deterministic-first, entity-centric NPC agent framework (LLM optional)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Iro Buang" }]

dependencies = [
  "pyyaml>=6.0",
  "tomli>=2.0.1; python_version<'3.11'",
]

[project.scripts]
npcframework = "npcframework.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

llamacpp = [
  "llama-cpp-python>=0.2.90",
]

[tool.setuptools]
packages = { find = { include = ["npcframework*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
